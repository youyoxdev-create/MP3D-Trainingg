<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 -apple-system,"Segoe UI",Inter,Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

em{font-style:normal;color:var(--a)}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--p);border-top:1px solid var(--l);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}

h1{font-size:clamp(30px,7vw,44px);line-height:1.1;margin:.3em 0;letter-spacing:-.03em;font-weight:700}h1.nm{font-size:clamp(26px,6vw,34px);margin:.2em 0 .4em}h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:1.3em 0 .6em}h3{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--m);margin:0 0 .25em}p{margin:.3em 0}.mu{color:var(--m)}
.hero{padding:22px 0 8px}.hero p{color:var(--m);font-size:17px;max-width:50ch}
.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:18px;box-shadow:0 1px 2px #0f1b2d0d;margin-bottom:12px}
.btn{background:var(--p);color:var(--t);border:1px solid var(--l);padding:10px 16px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;transition:.15s;touch-action:manipulation}.btn:hover{border-color:var(--a);color:var(--a)}.btn.sm{padding:6px 12px;font-size:14px}.btn:disabled{opacity:.4;cursor:default;border-color:var(--l);color:var(--t)}
.btn.p{background:var(--a);color:#fff;border-color:var(--a);font-weight:600}.btn.p:hover{filter:brightness(1.08);color:#fff}.btn.big{padding:14px 24px;font-size:16px;border-radius:12px}
.cta,.top,.foot,.row,.rg{display:flex;gap:10px;align-items:center}.cta{flex-wrap:wrap;margin:16px 0}.top,.foot{justify-content:space-between}.foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--l)}.rg{gap:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.g2{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.grid .card{margin:0}
.tile{cursor:pointer;border-left:4px solid var(--h,var(--a));transition:.15s}.tile:hover{border-color:var(--h,var(--a));box-shadow:0 4px 14px #0f1b2d14;transform:translateY(-1px)}.tile b{display:block;font-weight:600}.tile span{color:var(--m);font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}.ch{border:1px solid var(--l);background:var(--p);border-radius:8px;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px;color:var(--t)}.ch.on{background:var(--a);color:#fff;border-color:var(--a)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.st{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:14px}.st b{display:block;font-size:24px;font-weight:700;color:var(--a)}.st span{font-size:13px;color:var(--m)}
.v3{position:relative;height:min(50vh,380px);min-height:260px;margin:12px 0;border-radius:12px;border:1px solid var(--l);background:radial-gradient(circle at 50% 35%,var(--v1),var(--v2));overflow:hidden}.v3 canvas{display:block}.v3:after{content:"Glisser pour tourner · pincer ou molette pour zoomer";position:absolute;left:12px;bottom:8px;font-size:11.5px;color:var(--m);pointer-events:none}
.inf{border-left:3px solid var(--h,var(--a));background:var(--bg);padding:10px 14px;margin:10px 0;border-radius:0 10px 10px 0}
.def{background:var(--ib);border:1px solid var(--l);border-radius:12px;padding:18px;margin:12px 0;font-size:18px}.qq{font-weight:600;margin:12px 0 10px}
.row input,textarea{flex:1;min-width:0;width:100%;background:var(--bg);color:var(--t);border:1px solid var(--l);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text}input:focus,textarea:focus{outline:2px solid var(--a);outline-offset:-1px;background:var(--p)}
.bar{height:6px;background:var(--l);border-radius:6px;margin:10px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--a);border-radius:6px;transition:width .3s}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.opt{background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:10px;padding:14px 16px;font:inherit;font-weight:500;cursor:pointer;text-align:left;transition:.15s}.opt:hover:not(:disabled){border-color:var(--a);background:var(--ib)}.opt.good{background:var(--gb);border-color:var(--g)}.opt.bad{background:var(--rb);border-color:var(--r)}.opt.sel{border-color:var(--a);background:var(--ib)}
#fb{margin-top:12px;border-radius:10px;font-size:15px}#fb.g,#fb.w,#fb.i{padding:12px 14px}#fb.g{background:var(--gb);border:1px solid var(--g)}#fb.w{background:var(--wb);border:1px solid var(--w)}#fb.i{background:var(--ib);border:1px solid var(--a)}
#kb{margin-top:10px;display:grid;gap:6px}#kb div{display:flex;gap:5px;justify-content:center}#kb button{flex:1;max-width:46px;min-width:0;padding:11px 0;border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:8px;font:inherit;font-size:16px;cursor:pointer;touch-action:manipulation}#kb button:active{background:var(--ib)}#kb button.w{max-width:none;flex:2}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.modal>div{background:var(--p);border-radius:14px;padding:18px;max-width:560px;max-height:85vh;overflow:auto}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.fg div{padding:8px 11px;border-radius:8px;border:1px solid var(--l);font-size:14px;background:var(--p)}.fg .ma{border-color:var(--g);background:var(--gb)}.fg .rv{border-color:var(--w);background:var(--wb)}
.mr{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center}.res div{padding:9px 0;border-bottom:1px solid var(--l)}.ok{color:var(--g)}.ko{color:var(--r)}
.ti{display:block;width:100%;max-width:150px;margin:0 auto 8px;border-radius:8px;background:var(--bg)}.gv{width:96px;border-radius:8px;border:1px solid var(--l);cursor:pointer;background:var(--bg)}.gv:hover{border-color:var(--a)}.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.sheet input{width:100%;background:var(--bg);color:var(--t);border:1px solid var(--l);border-radius:8px;padding:8px 10px;font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}.logo svg{display:block}.logo em{font-size:11px;letter-spacing:.22em;font-weight:700}.hero2{padding:26px 18px 22px;border-radius:18px;margin:10px 0 14px;background:linear-gradient(135deg,var(--ib),var(--p));border:1px solid var(--l);text-align:center}.hero2 p{color:var(--m);font-size:16px;max-width:50ch;margin:10px auto}.ban{display:flex;justify-content:center}.hero2 .cta{justify-content:center}details{margin-top:8px}summary{cursor:pointer;color:var(--a)}body:before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--p);z-index:7}.rel{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rel>div{display:grid;gap:8px;align-content:start}.rel .opt{font-size:13.5px;padding:10px}.vb{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
var H3=0,SC,VN=null,LCUR;
const F=[
["Arrondi","Surface cylindrique convexe qui remplace une arête vive extérieure.","Bord d’une poignée ou d’un carter, pour ne pas se blesser.","Congé : le congé est concave (angle rentrant), l’arrondi est convexe (arête saillante). Chanfrein : plan incliné, pas courbe.","Arête extérieure adoucie, bombée vers l’extérieur."],
["Chanfrein","Petite surface plane inclinée, souvent à 45°, qui supprime une arête vive.","Entrée d’un perçage ou bout d’arbre pour faciliter le montage.","Arrondi : le chanfrein est plan, l’arrondi est courbe. Fraisure : cône à l’intérieur d’un trou.","Arête coupée par un plan incliné."],
["Congé","Raccordement concave et courbe entre deux surfaces formant un angle rentrant.","Pied d’un épaulement d’arbre : il limite la concentration de contraintes.","Arrondi : le congé est dans un creux (angle rentrant), l’arrondi sur une arête saillante.","Coin intérieur adouci, en creux."],
["Méplat","Surface plane usinée sur une pièce cylindrique, parallèle à son axe.","Prise de clé sur un axe ou appui d’une vis de pression.","Chanfrein (plan incliné sur une arête) ; épaulement (changement de diamètre).","Cylindre dont une portion est aplatie."],
["Épaulement","Changement brusque de diamètre sur un arbre, créant une face plane perpendiculaire à l’axe.","Butée axiale d’un roulement sur un arbre.","Dégagement (creux au pied de la marche) ; embase (partie large servant d’appui).","Une marche : deux diamètres reliés par une face plane."],
["Dégagement","Creux usiné dans l’angle de deux surfaces pour laisser sortir l’outil ou permettre un appui correct de la pièce associée.","Au pied d’un épaulement rectifié.","Gorge (creux circulaire isolé) ; congé (arrondi, sans creux).","Petit creux situé dans l’angle d’un épaulement."],
["Gorge","Creux circulaire usiné sur le contour d’une pièce de révolution.","Logement d’un circlips ou d’un joint torique sur un arbre.","Rainure (rectiligne) ; dégagement (situé dans un angle) ; cannelure (plusieurs creux parallèles à l’axe).","Anneau creux autour d’un arbre, à l’écart des épaulements."],
["Rainure","Entaille longue, à fond plat et section constante, creusée dans une surface sans la traverser.","Logement d’une languette dans un arbre ou un moyeu.","Lumière et trou oblong (traversent l’épaisseur) ; gorge (circulaire).","Canal rectiligne qui ne traverse pas l’épaisseur."],
["Nervure","Paroi mince en relief qui renforce une pièce sans trop l’alourdir.","Raidisseur d’un carter ou d’une console.","Bossage : local et massif ; la nervure est un voile mince et allongé.","Mince voile triangulaire reliant deux surfaces."],
["Bossage","Surépaisseur locale sur une surface brute, qui crée une zone d’appui à usiner.","Appui d’une vis sur un carter de fonderie.","Nervure (paroi mince) ; embase (grande base d’une pièce).","Plot qui dépasse d’une surface plane."],
["Cannelure","Série de rainures régulières parallèles à l’axe d’un arbre, formant des dents qui transmettent le couple.","Arbre cannelé de boîte de vitesses.","Rainure (une seule) ; gorge (circulaire) ; languette (pièce rapportée).","Profil en créneaux régulier tout autour d’un arbre."],
["Perçage borgne","Trou cylindrique qui ne traverse pas la pièce : il possède un fond.","Trou recevant un pion de centrage.","Perçage débouchant (traverse) ; lamage (il élargit l’entrée d’un trou, ce n’est pas le trou lui-même).","On voit un fond au trou.",["borgne","trou borgne"]],
["Perçage débouchant","Trou cylindrique qui traverse entièrement la pièce.","Passage d’une vis de fixation.","Perçage borgne (a un fond) ; alésage (trou usiné avec précision).","On voit à travers la pièce.",["debouchant","trou debouchant"]],
["Alésage","Surface cylindrique intérieure usinée avec précision (diamètre tolérancé) pour réaliser un ajustement.","Logement d’un roulement dans un carter.","Perçage (fait au foret, moins précis).","Trou de précision, repéré par une tolérance sur le plan (ex. Ø40 H7), qui reçoit un arbre ou une bague."],
["Fraisure","Évasement conique à l’entrée d’un trou, pour loger une tête de vis conique.","Vis à tête fraisée affleurante.","Lamage (fond plat, parois cylindriques) ; chanfrein (plan sur une arête).","Entonnoir à l’entrée d’un trou."],
["Lamage","Logement cylindrique à fond plat qui élargit l’entrée d’un trou, pour loger une tête de vis ou un écrou.","Tête de vis cylindrique encastrée.","Fraisure (conique) ; perçage borgne.","Marche circulaire à fond plat autour d’un trou."],
["Filetage","Hélice en relief usinée sur la surface extérieure d’une pièce cylindrique.","Tige filetée, boulon, vis.","Taraudage (hélice à l’intérieur d’un trou).","Hélice visible à l’extérieur d’une tige."],
["Taraudage","Hélice usinée à l’intérieur d’un trou, pour recevoir une vis.","Trou M8 d’un carter.","Filetage (hélice à l’extérieur).","Hélice visible à l’intérieur d’un trou."],
["Évidement","Enlèvement important de matière pour alléger la pièce ou créer un logement.","Cavité d’un carter, poche d’une pièce usinée.","Rainure (étroite et longue) ; lamage (petit et circulaire).","Grande poche creusée dans la pièce."],
["Trou oblong","Trou traversant allongé, aux extrémités arrondies, qui permet de régler la position d’une vis.","Fixation réglable d’un moteur ou d’un capot.","Lumière (plus longue, sert de passage ou de guidage) ; rainure (ne traverse pas).","Petit trou en forme de gélule dans lequel passe une vis.",["oblong"]],
["Lumière","Ouverture longue et traversante, de forme oblongue, servant de passage ou de guidage.","Fente guidant le levier d’une manette.","Trou oblong (court, sert au réglage) ; rainure (ne traverse pas). Selon les cours, les deux termes sont proches : on les distingue par la fonction.","Longue fente qui traverse entièrement la pièce."],
["Arbre","Pièce cylindrique longue, souvent étagée, qui supporte ou transmet un mouvement de rotation.","Arbre de moteur ou de boîte de vitesses.","Épaulement (une seule marche) ; cannelure.","Longue pièce de révolution à plusieurs diamètres."],
["Languette","Petite pièce prismatique à bouts arrondis, logée dans deux rainures pour lier un moyeu à un arbre.","Poulie liée à un arbre.","Rainure (le logement, pas la pièce) ; cannelure.","Petit barreau à bouts arrondis posé sur l’arbre."],
["Embase","Partie élargie à la base d’une pièce, qui sert d’appui et de fixation.","Platine d’un support, bride.","Bossage (local) ; épaulement (marche sur un arbre).","Large plaque percée à la base d’un corps."],
["Poinçonnage","Découpe d’une tôle par un poinçon et une matrice, qui crée des trous ou des formes.","Trous d’une tôle de fixation.","Perçage (foret, matière épaisse).","Tôle mince avec des trous de formes variées, aux bords nets."],
["Queue d’aronde","Glissière en trapèze, plus large en haut qu’en bas, qui guide et retient une autre pièce.","Glissière de machine-outil, coulisseau de réglage.","Rainure en T (parois droites) ; tenon (forme rectangulaire).","Trapèze élargi vers le haut : la pièce coulisse mais ne peut pas se décoller.",["aronde"]],
["Tenon","Partie saillante rectangulaire en bout de pièce, qui s’emboîte dans une mortaise.","Assemblage de deux pièces de bois ou de métal.","Mortaise (le creux qui reçoit le tenon) ; bossage (saillie locale sur une surface, sans emboîtement).","Petit bloc qui dépasse en bout de pièce."],
].map(([n,d,e,c,r,a=[]])=>({n,d,e,c,r,a}));
const SW=[
"Fonctions > Congé, type Rayon constant. Sélectionne l’arête vive extérieure, rayon 3 mm. SolidWorks utilise « Congé » pour l’arrondi comme pour le congé : seule la position de l’arête change.",
"Fonctions > Chanfrein. Sélectionne l’arête, mode Angle-distance (ex. 2 mm × 45°), valide.",
"Fonctions > Congé. Sélectionne l’arête de l’angle rentrant (le creux entre deux faces), rayon 2 mm. Même commande que l’arrondi.",
"Esquisse sur le plan de face : rectangle couvrant la zone à aplatir, côté extérieur à la cote voulue. Enlèvement de matière extrudé, « À travers tout » (symétrique).",
"Esquisse la demi-coupe de l’arbre sur le plan de face avec une ligne d’axe, puis Bossage avec révolution (360°). Chaque marche est un changement de diamètre dans l’esquisse.",
"Enlèvement de matière avec révolution : petit rectangle (ex. 0,5 × 2 mm) esquissé dans l’angle de l’épaulement, révolution autour de l’axe de l’arbre.",
"Esquisse un rectangle (largeur 1,2 mm, profondeur 0,5 mm) qui déborde du bord de l’arbre, puis Enlèvement de matière avec révolution autour de l’axe.",
"Esquisse sur la face : rectangle ou fente aux cotes voulues. Enlèvement de matière extrudé, profondeur borgne (ex. 3 mm). Pour une clavette : fente droite.",
"Esquisse un trait (ou un triangle) sur un plan perpendiculaire entre les deux faces à relier. Fonctions > Nervure : épaisseur 3 mm, direction vers la matière.",
"Esquisse le contour (cercle ou forme) sur la face, puis Bossage extrudé de 3 à 5 mm. C’est littéralement la commande « Bossage extrudé ».",
"Esquisse le profil d’une dent (un creux), Enlèvement de matière extrudé sur la longueur de l’arbre, puis Répétition circulaire autour de l’axe (ex. 10 occurrences).",
